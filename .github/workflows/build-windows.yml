name: Build Aim Trainer for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: Aim-Trainer-by-Vinay-GitHub-EXE-Build/aim-trainer-github-build

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Aim-Trainer-by-Vinay-GitHub-EXE-Build/aim-trainer-github-build/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Aim-Trainer-Windows
          path: Aim-Trainer-by-Vinay-GitHub-EXE-Build/aim-trainer-github-build/dist/*.exe
          if-no-files-found: error
          
