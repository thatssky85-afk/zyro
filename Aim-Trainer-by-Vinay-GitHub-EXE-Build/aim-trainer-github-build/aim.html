<!DOCTYPE html>
<html>
<head>
<title>Aim Trainer by Vinay</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

body {
    margin: 0;
    background: #080000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* MENU */

#menu {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center, #350000 0%, #100000 55%, #050000 100%);
}

.logo {
    font-size: 70px;
    font-weight: bold;
    font-style: italic;
    color: white;
    text-shadow: 0 0 20px red;
}

.logo span {
    color: #ff1111;
}

.vinay {
    color: #ff2222;
    font-size: 30px;
    font-weight: bold;
    margin-top: -10px;
}

.subtitle {
    color: #aaa;
    font-size: 18px;
    margin: 20px;
}

.start {
    width: 300px;
    padding: 18px;
    background: linear-gradient(#ff2222, #990000);
    color: white;
    border: 2px solid #ff4444;
    border-radius: 12px;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 30px red;
}

.start:hover {
    transform: scale(1.05);
    box-shadow: 0 0 50px red;
}

.buttons {
    display: flex;
    gap: 20px;
    margin-top: 35px;
}

.smallButton {
    padding: 15px 30px;
    background: #170000;
    color: white;
    border: 1px solid #880000;
    border-radius: 10px;
    cursor: pointer;
}

.smallButton:hover {
    background: #350000;
}

/* GAME */

#game {
    display: none;
    height: 100vh;
    background: #090000;
}

#topbar {
    height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 80px;
    background: #120000;
    border-bottom: 2px solid #600000;
}

.stat {
    font-size: 20px;
    color: #aaa;
}

.stat span {
    color: #ff2222;
    font-size: 27px;
    font-weight: bold;
}

#arena {
    position: relative;
    width: 100%;
    height: calc(100vh - 80px);
    cursor: crosshair;
}

/* TARGET */

#target {
    position: absolute;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #ff1515;
    border: 4px solid #ffaaaa;

    box-shadow:
        0 0 10px #ff0000,
        0 0 25px #ff0000,
        0 0 50px #ff0000;

    cursor: crosshair;
}

#target::before {
    content: "";
    position: absolute;
    width: 55%;
    height: 55%;
    left: 22.5%;
    top: 22.5%;
    border-radius: 50%;
    border: 3px solid white;
}

#target::after {
    content: "";
    position: absolute;
    width: 15%;
    height: 15%;
    left: 42.5%;
    top: 42.5%;
    background: white;
    border-radius: 50%;
}

/* RESULT */

#result {
    display: none;
    height: 100vh;
    text-align: center;
    padding-top: 100px;
    background:
        radial-gradient(circle, #350000, #080000 70%);
}

.resultTitle {
    font-size: 55px;
    color: #ff2222;
    text-shadow: 0 0 30px red;
}

.resultBox {
    width: 400px;
    margin: 30px auto;
    padding: 25px;
    background: #140000;
    border: 1px solid #770000;
    border-radius: 15px;
}

.resultStat {
    font-size: 22px;
    margin: 18px;
}

.resultStat span {
    color: #ff2222;
    font-weight: bold;
}

/* SETTINGS */

#settings {
    display: none;
    height: 100vh;
    text-align: center;
    padding-top: 100px;
    background: #0b0000;
}

.settingsBox {
    width: 400px;
    margin: auto;
    padding: 30px;
    background: #170000;
    border: 1px solid #770000;
    border-radius: 15px;
}

input {
    width: 80%;
}
</style>
</head>

<body>


<!-- MAIN MENU -->

<div id="menu">

    <div class="logo">
        AIM <span>TRAINER</span>
    </div>

    <div class="vinay">
        by Vinay
    </div>

    <div class="subtitle">
        Train Your Aim • Improve Accuracy • Get Faster
    </div>

    <button class="start" onclick="startGame()">
        ▶ START
    </button>

    <div class="buttons">

        <button class="smallButton" onclick="showSettings()">
            ⚙ Settings
        </button>

        <button class="smallButton" onclick="showHowToPlay()">
            ❔ How to Play
        </button>

    </div>

</div>


<!-- GAME -->

<div id="game">

    <div id="topbar">

        <div class="stat">
            SCORE
            <span id="score">0</span>
        </div>

        <div class="stat">
            TIME
            <span id="time">60</span>
        </div>

        <div class="stat">
            ACCURACY
            <span id="accuracy">100%</span>
        </div>

        <div class="stat">
            STREAK
            <span id="streak">0</span>
        </div>

    </div>

    <div id="arena">

        <div id="target"></div>

    </div>

</div>


<!-- RESULT -->

<div id="result">

    <div class="resultTitle">
        GAME OVER
    </div>

    <div class="resultBox">

        <div class="resultStat">
            🎯 Score:
            <span id="finalScore">0</span>
        </div>

        <div class="resultStat">
            🔥 Best Streak:
            <span id="finalStreak">0</span>
        </div>

        <div class="resultStat">
            🎯 Accuracy:
            <span id="finalAccuracy">0%</span>
        </div>

        <div class="resultStat">
            ⚡ Reaction:
            <span id="finalReaction">0 ms</span>
        </div>

    </div>

    <button class="start" onclick="startGame()">
        ▶ PLAY AGAIN
    </button>

    <br><br>

    <button class="smallButton" onclick="showMenu()">
        MAIN MENU
    </button>

</div>


<!-- SETTINGS -->

<div id="settings">

    <h1>⚙ SETTINGS</h1>

    <div class="settingsBox">

        <h2>Target Size</h2>

        <input
            type="range"
            id="targetSize"
            min="30"
            max="90"
            value="65"
        >

        <p>
            Size:
            <span id="sizeValue">65</span> px
        </p>

        <button class="start" onclick="showMenu()">
            SAVE
        </button>

    </div>

</div>


<script>

let score = 0;
let streak = 0;
let bestStreak = 0;

let clicks = 0;
let hits = 0;

let timeLeft = 60;

let timer;
let targetStart;

let totalReaction = 0;

const target = document.getElementById("target");
const arena = document.getElementById("arena");

const targetSizeSlider =
    document.getElementById("targetSize");

targetSizeSlider.addEventListener("input", function() {

    document.getElementById("sizeValue").textContent =
        this.value;

});


/* START GAME */

function startGame() {

    clearInterval(timer);

    score = 0;
    streak = 0;
    bestStreak = 0;

    clicks = 0;
    hits = 0;

    totalReaction = 0;

    timeLeft = 60;

    document.getElementById("menu").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("settings").style.display = "none";

    document.getElementById("game").style.display = "block";

    updateStats();

    target.style.display = "block";

    moveTarget();

    timer = setInterval(function() {

        timeLeft--;

        updateStats();

        if (timeLeft <= 0) {

            endGame();

        }

    }, 1000);
}


/* TARGET CLICK */

target.addEventListener("click", function(event) {

    event.stopPropagation();

    clicks++;
    hits++;

    let reaction =
        Date.now() - targetStart;

    totalReaction += reaction;

    score++;

    streak++;

    if (streak > bestStreak) {
        bestStreak = streak;
    }

    moveTarget();

    updateStats();

});


/* MISSED CLICK */

arena.addEventListener("click", function() {

    clicks++;

    streak = 0;

    updateStats();

});


/* MOVE TARGET */

function moveTarget() {

    let size =
        Number(targetSizeSlider.value);

    /*
    Every 5 points the target gets smaller.
    */

    size =
        Math.max(
            20,
            size - Math.floor(score / 5) * 4
        );

    target.style.width = size + "px";
    target.style.height = size + "px";

    let maxX =
        arena.clientWidth - size;

    let maxY =
        arena.clientHeight - size;

    let x =
        Math.random() * maxX;

    let y =
        Math.random() * maxY;

    target.style.left = x + "px";
    target.style.top = y + "px";

    targetStart = Date.now();
}


/* UPDATE UI */

function updateStats() {

    document.getElementById("score").textContent =
        score;

    document.getElementById("time").textContent =
        timeLeft;

    document.getElementById("streak").textContent =
        streak;

    let accuracy =
        clicks > 0
        ? Math.round((hits / clicks) * 100)
        : 100;

    document.getElementById("accuracy").textContent =
        accuracy + "%";
}


/* END GAME */

function endGame() {

    clearInterval(timer);

    target.style.display = "none";

    document.getElementById("game").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";

    let accuracy =
        clicks > 0
        ? Math.round((hits / clicks) * 100)
        : 100;

    let reaction =
        hits > 0
        ? Math.round(totalReaction / hits)
        : 0;

    document.getElementById("finalScore").textContent =
        score;

    document.getElementById("finalStreak").textContent =
        bestStreak;

    document.getElementById("finalAccuracy").textContent =
        accuracy + "%";

    document.getElementById("finalReaction").textContent =
        reaction + " ms";
}


/* MENU */

function showMenu() {

    clearInterval(timer);

    document.getElementById("game").style.display =
        "none";

    document.getElementById("result").style.display =
        "none";

    document.getElementById("settings").style.display =
        "none";

    document.getElementById("menu").style.display =
        "flex";
}


/* SETTINGS */

function showSettings() {

    document.getElementById("menu").style.display =
        "none";

    document.getElementById("settings").style.display =
        "block";
}


/* HOW TO PLAY */

function showHowToPlay() {

    alert(
        "HOW TO PLAY\n\n" +
        "1. Press START.\n\n" +
        "2. A red target will appear.\n\n" +
        "3. Click it as fast as possible.\n\n" +
        "4. A new target appears immediately.\n\n" +
        "5. You have 60 seconds.\n\n" +
        "6. Try to get the highest score!"
    );
}

</script>

</body>
</html>
